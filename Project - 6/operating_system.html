<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Quiz with Timer</title>
    </head>
    <body>
        <h2>Quiz with Timer</h2>
        <div id="timer">Time Left: <span id="time">60</span> seconds</div>

        <div class="quiz">

            <div class="question" data-answer="b">
              <p>1. What is the capital of France?</p>
              <label class="option"><input type="radio" name="q1" value="a"> Berlin</label>
              <label class="option"><input type="radio" name="q1" value="b"> Paris</label>
              <label class="option"><input type="radio" name="q1" value="c"> Rome</label>
            </div>

            <div class="question" data-answer="a">
              <p>2. What is 5 + 3?</p>
              <label class="option"><input type="radio" name="q2" value="a"> 8</label>
              <label class="option"><input type="radio" name="q2" value="b"> 10</label>
              <label class="option"><input type="radio" name="q2" value="c"> 7</label>
            </div>

            <div class="question" data-answer="c">
              <p>3. Which is a programming language?</p>
              <label class="option"><input type="radio" name="q3" value="a"> HTML</label>
              <label class="option"><input type="radio" name="q3" value="b"> CSS</label>
              <label class="option"><input type="radio" name="q3" value="c"> Python</label>
            </div>

            <button id="submitBtn" onclick="submitQuiz()">Submit</button>
            <div id="result"></div>

        </div>
        <script src="./js/common.js"></script>
    </body>
</html>
